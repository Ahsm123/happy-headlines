services:
  article-db:
    image: postgres:17
    environment:
      POSTGRES_DB: articledb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - article-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  article-service-1: &article
    build:
      context: src/ArticleService
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ArticleDbConnection: "Host=article-db;Port=5432;Database=articledb;Username=postgres;Password=dev"
    depends_on:
      article-db:
        condition: service_healthy
        
  article-service-2: *article
  article-service-3: *article
        
  article-lb:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/article.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - article-service-1

volumes:
  article-db-data:

