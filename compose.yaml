services:
  global-db:
    image: postgres:17
    environment:
      POSTGRES_DB: articledb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    volumes:
      - global-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  africa-db:
    image: postgres:17
    environment:
      POSTGRES_DB: articledb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    volumes:
      - africa-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  antarctica-db:
    image: postgres:17
    environment:
      POSTGRES_DB: articledb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    volumes:
      - antarctica-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  asia-db:
    image: postgres:17
    environment:
      POSTGRES_DB: articledb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    volumes:
      - asia-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  europe-db:
    image: postgres:17
    environment:
      POSTGRES_DB: articledb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    volumes:
      - europe-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  north-america-db:
    image: postgres:17
    environment:
      POSTGRES_DB: articledb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    volumes:
      - north-america-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  oceania-db:
    image: postgres:17
    environment:
      POSTGRES_DB: articledb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    volumes:
      - oceania-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  south-america-db:
    image: postgres:17
    environment:
      POSTGRES_DB: articledb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    volumes:
      - south-america-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  article-service-1: &article
    build:
      context: .
      dockerfile: src/ArticleService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      SEQ_URL: http://seq:5341
    depends_on:
      global-db:
        condition: service_healthy
      africa-db:
        condition: service_healthy
      antarctica-db:
        condition: service_healthy
      asia-db:
        condition: service_healthy
      europe-db:
        condition: service_healthy
      north-america-db:
        condition: service_healthy
      oceania-db:
        condition: service_healthy
      south-america-db:
        condition: service_healthy
        
  article-service-2: *article
  article-service-3: *article
        
  article-lb:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/article.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - article-service-1
        
        
  comment-service:
    build:
      context: .
      dockerfile: src/CommentService/Dockerfile
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      SEQ_URL: http://seq:5341
    depends_on:
      comment-db:
        condition: service_healthy

  comment-db:
    image: postgres:17
    environment:
      POSTGRES_DB: commentdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    volumes:
      - comment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      retries: 10

  profanity-service:
    build:
      context: .
      dockerfile: src/ProfanityService/Dockerfile
    ports:
      - "8082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      SEQ_URL: http://seq:5341
    depends_on:
      profanity-db:
        condition: service_healthy

  profanity-db:
    image: postgres:17
    environment:
      POSTGRES_DB: profanitydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    volumes:
      - profanity-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      retries: 10
      
  draft-service:
    build:
      context: .
      dockerfile: src/DraftService/Dockerfile
    ports:
      - "8083:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      SEQ_URL: http://seq:5341
    depends_on:
      profanity-db:
        condition: service_healthy
  
  draft-db:
    image: postgres:17
    environment:
      POSTGRES_DB: draftdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    volumes:
      - draft-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      retries: 10
      
  seq:
    image: datalust/seq
    ports:
      - "5341:5341"
      - "5342:80"
    volumes:
      - rps-seq-data:/data
    environment:
      - ACCEPT_EULA=Y
  
  

volumes:
  global-db-data:
  africa-db-data:
  antarctica-db-data:
  asia-db-data:
  europe-db-data:
  north-america-db-data:
  oceania-db-data:
  south-america-db-data:
  comment-db-data:
  profanity-db-data:
  draft-db-data:
  rps-seq-data:

