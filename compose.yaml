services:
  global-db:
    image: postgres:17
    ports: ["5433:5432"]
    environment:
      POSTGRES_DB: articledb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    volumes:
      - global-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      retries: 10

  africa-db:
    image: postgres:17
    ports: ["5434:5432"]
    environment:
      POSTGRES_DB: articledb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    volumes:
      - africa-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      retries: 10

  antarctica-db:
    image: postgres:17
    ports: ["5435:5432"]
    environment:
      POSTGRES_DB: articledb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    volumes:
      - antarctica-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      retries: 10

  asia-db:
    image: postgres:17
    ports: ["5436:5432"]
    environment:
      POSTGRES_DB: articledb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    volumes:
      - asia-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      retries: 10

  europe-db:
    image: postgres:17
    ports: ["5437:5432"]
    environment:
      POSTGRES_DB: articledb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    volumes:
      - europe-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      retries: 10

  north-america-db:
    image: postgres:17
    ports: ["5438:5432"]
    environment:
      POSTGRES_DB: articledb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    volumes:
      - north-america-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      retries: 10

  oceania-db:
    image: postgres:17
    ports: ["5439:5432"]
    environment:
      POSTGRES_DB: articledb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    volumes:
      - oceania-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      retries: 10

  south-america-db:
    image: postgres:17
    ports: ["5440:5432"]
    environment:
      POSTGRES_DB: articledb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    volumes:
      - south-america-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      retries: 10

  article-api-1: &article
    build:
      context: .
      dockerfile: src/HappyHeadlines.ArticleApi/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Seq: http://seq:5341
      ConnectionStrings__Zipkin: http://zipkin:9411/api/v2/spans
      ConnectionStrings__Messaging: host=rabbitmq;username=kalo;password=kalo
      ConnectionStrings__DatabaseGlobal: Host=global-db;Port=5432;Database=articledb;Username=postgres;Password=dev
      ConnectionStrings__DatabaseAfrica: Host=africa-db;Port=5432;Database=articledb;Username=postgres;Password=dev
      ConnectionStrings__DatabaseAntarctica: Host=antarctica-db;Port=5432;Database=articledb;Username=postgres;Password=dev
      ConnectionStrings__DatabaseAsia: Host=asia-db;Port=5432;Database=articledb;Username=postgres;Password=dev
      ConnectionStrings__DatabaseEurope: Host=europe-db;Port=5432;Database=articledb;Username=postgres;Password=dev
      ConnectionStrings__DatabaseNorthAmerica: Host=north-america-db;Port=5432;Database=articledb;Username=postgres;Password=dev
      ConnectionStrings__DatabaseOceania: Host=oceania-db;Port=5432;Database=articledb;Username=postgres;Password=dev
      ConnectionStrings__DatabaseSouthAmerica: Host=south-america-db;Port=5432;Database=articledb;Username=postgres;Password=dev
      ConnectionStrings__Redis: redis:6379,password=kalo
    depends_on:
      global-db:
        condition: service_healthy
      africa-db:
        condition: service_healthy
      antarctica-db:
        condition: service_healthy
      asia-db:
        condition: service_healthy
      europe-db:
        condition: service_healthy
      north-america-db:
        condition: service_healthy
      oceania-db:
        condition: service_healthy
      south-america-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  
  article-api-2: *article
  article-api-3: *article
  
  article-lb:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/article.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1/health" ]
      interval: 5s
      retries: 10
    depends_on:
      - article-api-1
      - article-api-2
      - article-api-3
  
  
  comment-api:
    build:
      context: .
      dockerfile: src/HappyHeadlines.CommentApi/Dockerfile
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Seq: http://seq:5341
      ConnectionStrings__Zipkin: http://zipkin:9411/api/v2/spans
      ConnectionStrings__Database: Host=comment-db;Port=5432;Database=commentdb;Username=postgres;Password=dev
      Apis__ProfanityApi: http://profanity-api:8080
      ConnectionStrings__Redis: redis:6379,password=kalo
    depends_on:
      profanity-api:
        condition: service_started
      comment-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  comment-db:
    image: postgres:17
    ports: ["5441:5432"]
    environment:
      POSTGRES_DB: commentdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    volumes:
      - comment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      retries: 10

  profanity-api:
    build:
      context: .
      dockerfile: src/HappyHeadlines.ProfanityApi/Dockerfile
    ports:
      - "8082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Seq: http://seq:5341
      ConnectionStrings__Zipkin: http://zipkin:9411/api/v2/spans
      ConnectionStrings__Database: Host=profanity-db;Port=5432;Database=profanitydb;Username=postgres;Password=dev
    depends_on:
      profanity-db:
        condition: service_healthy

  profanity-db:
    image: postgres:17
    ports: ["5442:5432"]
    environment:
      POSTGRES_DB: profanitydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    volumes:
      - profanity-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      retries: 10
  
  draft-api:
    build:
      context: .
      dockerfile: src/HappyHeadlines.DraftApi/Dockerfile
    ports:
      - "8083:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Seq: http://seq:5341
      ConnectionStrings__Zipkin: http://zipkin:9411/api/v2/spans
      ConnectionStrings__Database: Host=draft-db;Port=5432;Database=draftdb;Username=postgres;Password=dev
    depends_on:
      draft-db:
        condition: service_healthy
  
  draft-db:
    image: postgres:17
    ports: ["5443:5432"]
    environment:
      POSTGRES_DB: draftdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    volumes:
      - draft-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      retries: 10
  
  publisher-api:
    build:
      context: .
      dockerfile: src/HappyHeadlines.PublisherApi/Dockerfile
    ports:
      - "8084:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Seq: http://seq:5341
      ConnectionStrings__Zipkin: http://zipkin:9411/api/v2/spans
      ConnectionStrings__Messaging: host=rabbitmq;username=kalo;password=kalo
    depends_on:
      rabbitmq:
        condition: service_healthy
  
  newsletter-api:
    build:
      context: .
      dockerfile: src/HappyHeadlines.NewsletterApi/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Seq: http://seq:5341
      ConnectionStrings__Zipkin: http://zipkin:9411/api/v2/spans
      ConnectionStrings__Messaging: host=rabbitmq;username=kalo;password=kalo
      Apis__ArticleApi: http://article-lb:80
    depends_on:
      article-lb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  
  redis:
    image: redis:8-alpine
    container_name: my-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass kalo
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "kalo", "ping" ]
      interval: 5s
      retries: 10
    restart: unless-stopped
  
  prometheus:
    image: prom/prometheus:v3
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    restart: unless-stopped
    volumes:
      - ./prometheus:/etc/prometheus
      - prom-data:/prometheus
  
  grafana:
    image: grafana/grafana:13.2
    container_name: grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=grafana
    volumes:
      - ./grafana:/etc/grafana/provisioning
  
  seq:
    image: datalust/seq
    ports:
      - "5341:5341"
      - "5342:80"
    volumes:
      - rps-seq-data:/data
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
  zipkin:
    image: openzipkin/zipkin
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mysql
      - MYSQL_HOST=zipkin-storage
      - MYSQL_USER=zipkin
      - MYSQL_PASS=zipkin
    depends_on:
      - zipkin-storage
  
  zipkin-storage:
    image: openzipkin/zipkin-mysql
    ports:
      - "3306:3306"
    volumes:
      - zipkin-data:/mysql/data
  
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    restart: always
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: kalo
      RABBITMQ_DEFAULT_PASS: kalo
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq/
      - rabbitmq-log:/var/log/rabbitmq
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmq-diagnostics ping" ]
      interval: 5s
      retries: 10

volumes:
  global-db-data:
  africa-db-data:
  antarctica-db-data:
  asia-db-data:
  europe-db-data:
  north-america-db-data:
  oceania-db-data:
  south-america-db-data:
  comment-db-data:
  profanity-db-data:
  draft-db-data:
  rps-seq-data:
  zipkin-data:
  rabbitmq-lib:
  rabbitmq-log:
  prom-data:

