name: Publish newsletter image

on:
  push:
    branches:
      - main
    paths:
      - src/HappyHeadlines.NewsletterApi/**
      - tests/HappyHeadlines.NewsletterApi.Tests/**
      - src/HappyHeadlines.ServiceDefaults/**
      - src/HappyHeadlines.Contracts/**
      - Directory.Build.props
      - .dockerignore
      - .github/workflows/newsletter-api.yml

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build and test
        run: dotnet test tests/HappyHeadlines.NewsletterApi.Tests

  push_to_registry:
    name: Push Docker image to ghcr
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Login to registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up build
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/HappyHeadlines.NewsletterApi/Dockerfile
          push: true
          tags: ghcr.io/ahsm123/happy-headlines-newsletter-api:${{ github.run_number }}
