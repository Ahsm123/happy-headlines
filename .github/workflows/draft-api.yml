name: draft-api

on:
  push:
    branches:
      - main
    paths:
      - src/HappyHeadlines.DraftApi/**
      - src/HappyHeadlines.ServiceDefaults/**
      - src/HappyHeadlines.Contracts/**
      - Directory.Build.props
      - .dockerignore
      - .github/workflows/draft-api.yml

permissions: 
  contents: read
  packages: write
  
jobs: 
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: src/HappyHeadlines.DraftApi/Dockerfile
          push: true
          tags: ghcr.io/ahsm123/happy-headlines-draft-api:${{ github.run_number }}
        
        
  
