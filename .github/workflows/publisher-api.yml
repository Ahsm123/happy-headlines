name: publisher-api

on:
  push:
    branches:
      - main
    paths:
      - src/HappyHeadlines.PublisherApi/**
      - src/HappyHeadlines.ServiceDefaults/**
      - src/HappyHeadlines.Contracts/**
      - Directory.Build.props
      - .dockerignore
      - .github/workflows/publisher-api.yml

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: src/HappyHeadlines.PublisherApi/Dockerfile
        
        
  
