name: Publish article image

on:
  push:
    branches:
      - main
    paths:
      - src/HappyHeadlines.ArticleApi/**
      - src/HappyHeadlines.ServiceDefaults/**
      - src/HappyHeadlines.Contracts/**
      - Directory.Build.props
      - .dockerignore
      - .github/workflows/article-api.yml
  
jobs: 
  push_to_registry:
    name: Push Docker image to ghcr
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
        
      - name: Login to registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Set up build
        uses: docker/setup-buildx-action@v4
        
      - name: Build and push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/HappyHeadlines.ArticleApi/Dockerfile
          push: true
          tags: ghcr.io/ahsm123/happy-headlines-article-api:${{ github.run_number }}
        
        
  
